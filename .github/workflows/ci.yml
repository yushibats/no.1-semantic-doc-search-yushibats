name: Validate application and deployment

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_call:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit_repository.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
          enable-cache: true
      - run: uv sync --directory backend --locked --python 3.13 --group dev
      - run: uv run --directory backend --frozen ruff check app tests
      - run: uv run --directory backend --frozen pytest -q
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run --prefix frontend test:ui
      - run: npm run --prefix frontend build
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Check shell syntax
        run: |
          for script in init_script.sh restart.sh scripts/*.sh; do
            bash -n "$script"
          done

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/stack
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: python3 ../../scripts/validate_cloud_init.py
