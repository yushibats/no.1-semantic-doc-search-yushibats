name: Prepare release artifacts

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package the tagged commit
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/package_release.py --repository "$RELEASE_REPOSITORY"
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/semantic-doc-search-source.zip dist/semantic-doc-search-stack.zip dist/SHA256SUMS
          --verify-tag --generate-notes --draft --title "$RELEASE_TAG"
